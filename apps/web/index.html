<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transbot Race Dashboard</title>
  <link rel="stylesheet" href="/ui/style.css" />
</head>
<body>
  <header>
    <h1>Transbot Race Dashboard</h1>
    <div class="conn">
      <span id="dot" class="dot"></span>
      <span id="connText">disconnected</span>
      <button id="mockBtn">Mock on</button>
    </div>
  </header>

  <main>
    <section class="panel controls">
      <h2>Run controls</h2>
      <div class="ctlRow">
        <label>SSH</label>
        <input id="ssh" type="text" value="yahboom" />
        <button id="deployBtn">Deploy</button>
      </div>
      <div class="ctlRow">
        <label>Max s</label>
        <input id="maxSec" type="range" min="2" max="120" step="1" value="60" />
        <input id="maxSecN" type="number" min="2" max="120" step="1" value="60" />
      </div>
      <div class="ctlRow checkRow">
        <label>Debug</label>
        <label class="check"><input id="debugCapture" type="checkbox" /> capture frames + logs</label>
      </div>
      <div class="btnGrid">
        <button class="run final" data-profile="final">统一运行</button>
        <button id="stopBtn" class="stop">强制停车</button>
        <button id="reloadVideoBtn">重连视频</button>
      </div>
      <div id="msg" class="msg"></div>
      <p class="hint">先 Deploy 同步代码，再统一运行；拐点、虚线、圆环都走同一套连续跟踪器。</p>
    </section>

    <section class="panel video">
      <h2>Live view</h2>
      <div class="videoWrap">
        <img id="video" alt="live video" />
        <div id="cropBox"></div>
      </div>
      <p class="hint">Video streams from the robot over SSH via the debug backend. The
        amber box shows the configured crop.</p>
    </section>

    <section class="panel strategy">
      <h2>Margin strategy</h2>
      <div class="ctlRow">
        <label>Mode</label>
        <select id="strategyMode">
          <option value="none">No margin</option>
          <option value="corner_event">Corner event</option>
          <option value="ipm_axle">IPM axle path</option>
          <option value="local_pursuit">Local path pursuit</option>
        </select>
        <button id="strategySaveBtn">Apply</button>
      </div>
      <div class="ctlRow checkRow">
        <label>Obstacle</label>
        <label class="check"><input id="obstacleEnabled" type="checkbox" /> enable detector</label>
      </div>
      <div class="ctlRow"><label>Margin m</label><input id="strategyMargin" type="number" min="0" max="0.3" step="0.005" /></div>
      <div class="strategyFields" data-modes="corner_event">
        <div class="ctlRow"><label>Confirm</label><input id="cornerConfirm" type="number" min="1" max="10" step="1" /></div>
        <div class="ctlRow"><label>Theta</label><input id="cornerTheta" type="number" min="0.05" max="1" step="0.01" /></div>
      </div>
      <div class="strategyFields" data-modes="ipm_axle,local_pursuit">
        <div class="ctlRow"><label>Lookahead m</label><input id="strategyLookahead" type="number" min="0.02" max="0.3" step="0.005" /></div>
        <div class="calib-controls">
          <input id="paperNearM" type="number" min="0" max="0.5" step="0.005" aria-label="Paper near edge metres" />
          <button id="calibCaptureBtn">Capture rectangle</button>
          <button id="calibResetBtn">Reset points</button>
          <button id="calibSaveBtn">Save calibration</button>
        </div>
        <div class="calibWrap"><img id="calibImage" alt="Ground calibration" /><canvas id="calibCanvas"></canvas></div>
      </div>
      <div id="strategyStatus" class="msg"></div>
    </section>

    <section class="panel state">
      <h2>Controller</h2>
      <div class="stateRow">
        <span id="stateLight" class="light"></span>
        <span id="stateName" class="stateName">--</span>
        <span id="modeName" class="pill">--</span>
      </div>
      <div class="bars">
        <div class="bar"><label>e0</label><div class="track"><div id="bar_e0" class="fill signed"></div></div><span id="val_e0">0</span></div>
        <div class="bar"><label>theta</label><div class="track"><div id="bar_theta" class="fill signed"></div></div><span id="val_theta">0</span></div>
        <div class="bar"><label>kappa</label><div class="track"><div id="bar_kappa" class="fill signed"></div></div><span id="val_kappa">0</span></div>
        <div class="bar"><label>conf</label><div class="track"><div id="bar_conf" class="fill"></div></div><span id="val_conf">0</span></div>
        <div class="bar"><label>v</label><div class="track"><div id="bar_v" class="fill"></div></div><span id="val_v">0</span></div>
        <div class="bar"><label>w</label><div class="track"><div id="bar_w" class="fill signed"></div></div><span id="val_w">0</span></div>
      </div>
      <canvas id="chart" width="440" height="150"></canvas>
      <p class="hint">Series: <b class="c-e0">e0</b> · <b class="c-theta">theta</b> · <b class="c-conf">conf</b></p>
    </section>
  </main>

  <script src="/ui/app.js"></script>
</body>
</html>
